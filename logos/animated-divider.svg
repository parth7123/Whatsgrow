<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="100%" height="12">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="20%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes linePulse {
      0%, 100% { opacity: 0.4; stroke-width: 2; }
      50% { opacity: 1; stroke-width: 4; }
    }
    .pulse-line {
      animation: linePulse 3s ease-in-out infinite;
    }
  </style>
  <line class="pulse-line" x1="0" y1="6" x2="1000" y2="6" stroke="url(#grad)" stroke-linecap="round" />
</svg>

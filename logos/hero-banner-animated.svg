<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>

    <!-- Glowing Electric Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Glassmorphism Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Radial Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blurReveal {
      0% {
        filter: blur(16px);
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      60% {
        filter: blur(4px);
        opacity: 0.8;
      }
      100% {
        filter: blur(0px);
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      50% {
        opacity: 0.75;
        transform: scale(1.08);
      }
    }

    @keyframes waveMove {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: 1000;
      }
    }

    @keyframes badgeFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    .animated-banner {
      animation: blurReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center center;
    }

    .glowing-orb-1 {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: 200px 100px;
    }

    .glowing-orb-2 {
      animation: pulseGlow 5s ease-in-out infinite 1s;
      transform-origin: 800px 240px;
    }

    .wave-line {
      stroke-dasharray: 20, 10;
      animation: waveMove 25s linear infinite;
    }

    .badge-float-1 {
      animation: badgeFloat 3.5s ease-in-out infinite;
    }

    .badge-float-2 {
      animation: badgeFloat 4s ease-in-out infinite 0.5s;
    }

    .badge-float-3 {
      animation: badgeFloat 3.8s ease-in-out infinite 1s;
    }

    .sub-text {
      font-family: 'Fira Code', 'Roboto Mono', monospace;
      font-weight: 500;
    }
  </style>

  <!-- Container Frame -->
  <rect width="1000" height="340" rx="20" fill="url(#bgGrad)" />
  <rect width="996" height="336" x="2" y="2" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="glowing-orb-1" cx="180" cy="90" r="140" fill="#3B82F6" opacity="0.25" filter="url(#glowFilter)" />
  <circle class="glowing-orb-2" cx="820" cy="250" r="160" fill="#06B6D4" opacity="0.2" filter="url(#glowFilter)" />

  <!-- Subtle Wave Grid Background -->
  <path class="wave-line" d="M -100 280 Q 250 180 600 290 T 1100 200" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.6" />
  <path class="wave-line" d="M -100 220 Q 300 320 700 200 T 1100 280" fill="none" stroke="url(#blueGlow)" stroke-width="1.5" opacity="0.3" />

  <!-- Animated Main Content Group with Blur Reveal -->
  <g class="animated-banner">
    <!-- User's Exact White SVG Vector Logo Group -->
    <g transform="translate(265, -135) scale(1.1)">
      <g transform="matrix(1,0,0,1,-17.5,24)">
          <g transform="matrix(1,0,0,1,-77,-10)">
              <text x="215px" y="261.676px" style="font-family:'CenturyGothic', 'Century Gothic', sans-serif;font-size:9.067px;fill:white;">Le Choix des Marques</text>
          </g>
          <g transform="matrix(1.099206,0,0,0.8,-41.269841,47.8)">
              <rect x="164" y="239" width="252" height="5" style="fill:white;"/>
          </g>
          <g transform="matrix(1,0,0,1,-82,-100)">
              <text x="195px" y="336.271px" style="font-family:'GrandCru-ExtralightMItalic';font-weight:200;font-style:italic;font-size:53.333px;fill:rgb(59,130,246);">Whats</text>
              <text x="353.613px" y="336.271px" style="font-family:'CenturyGothic-Bold', 'Century Gothic', sans-serif;font-weight:700;font-size:53.333px;fill:white;">Grow</text>
          </g>
          <g transform="matrix(0.866667,0,0,0.931034,49.333333,13.965517)">
              <rect x="415" y="217" width="15" height="29" style="fill:white;"/>
          </g>
      </g>
    </g>

    <!-- Tagline -->
    <text x="500" y="195" text-anchor="middle" class="sub-text" font-size="19" fill="#94A3B8" letter-spacing="1">
      ⚡ NEXT-GEN WHATSAPP AUTOMATION &amp; MARKETING GATEWAY
    </text>

    <!-- Floating Badges -->
    <g class="badge-float-1" transform="translate(180, 235)">
      <rect width="180" height="44" rx="22" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" class="sub-text" font-size="14" fill="#60A5FA" font-weight="600">🔓 100% Self-Hosted</text>
    </g>

    <g class="badge-float-2" transform="translate(410, 235)">
      <rect width="180" height="44" rx="22" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" class="sub-text" font-size="14" fill="#22D3EE" font-weight="600">📱 Multi-Session</text>
    </g>

    <g class="badge-float-3" transform="translate(640, 235)">
      <rect width="180" height="44" rx="22" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" class="sub-text" font-size="14" fill="#34D399" font-weight="600">🐳 Docker Native</text>
    </g>
  </g>
</svg>
